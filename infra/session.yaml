# ============================================================================
# FichaSS — session COMPUTE stack (Fase 15, D-54/D-55) — GESTIONADO POR CI
# ============================================================================
#
# Stack DESECHABLE de cómputo: Lambda + Function URL. La TABLA DE SESIÓN
# NO vive aquí — está en el stack de DATOS (infra/data.yaml, stack
# fichass-data, decisión del usuario 2026-11-23) para que sobreviva a la
# recreación de este stack (el self-heal de borrado/recreación dejaba la
# tabla huérfana por Retain y bloqueaba la recreación con el nombre
# ocupado — saga de huérfanos Fase 09/15). El nombre de la tabla es
# determinista (fichass-sessions-<repo>) y el rol construye su ARN con
# !Sub — SIN cross-stack references.
#
# Gestionado por CI (job `infra` del workflow, scripts/deploy-stack.sh):
# crea/actualiza/sanagua el stack en cada push. El hosting (bucket, rol
# OIDC, SSM) sigue siendo huérfano estable documentado en infra/template.yaml.
#
# COSTE €0 (I2/D-11): Lambda 1M req/mes always-free, Function URL gratis,
# CloudWatch Logs free tier. SIN API Gateway (su free tier es de 12 meses →
# riesgo I2). Sin CloudFront.
#
# La Lambda valida el estado de sesión con la MISMA lógica pura que el
# cliente (src/session-schema.ts, bundle esbuild de backend/session.ts).
# ============================================================================

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FichaSS - session compute (Lambda Function URL, Free Tier only, CORS pinned to the site origin). The session TABLE lives in the DATA stack (infra/data.yaml).

Parameters:
  GitHubRepo:
    Type: String
    Default: rol_character_manager
    Description: GitHub repository name (resource-name suffix).
  SiteBucketName:
    Type: String
    Default: fichass-site
    Description: Hosting bucket name (read-only source of the authored JSONs).

Resources:

  # --------------------------------------------------------------------------
  # Session table ARN is CONSTRUCTED (no GetAtt): the table lives in the
  # DATA stack (fichass-data) with the deterministic name below.
  # --------------------------------------------------------------------------
  SessionFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fichass-session-${GitHubRepo}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: fichass-session-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadWriteSessionsTableOnly
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/fichass-sessions-${GitHubRepo}
              # Basic execution logging (CloudWatch Logs free tier).
              - Sid: LambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:*:*:*

  SessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fichass-session-${GitHubRepo}
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Handler: index.handler
      # Pre-bundled by `npm run build:backend` (esbuild, single-file ESM
      # with the AWS SDK inlined). The banner injects createRequire so
      # the SDK's CJS dist can require node builtins (an ESM bundle
      # without it dies with "Dynamic require of node:https"; the CJS
      # format instead breaks the SDK's lazy exports — both diagnosed
      # in Fase 15a). NO SAM esbuild metadata: the bundle is
      # deterministic and built by the workflow before `sam build`.
      CodeUri: backend/dist
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt SessionFunctionRole.Arn
      Environment:
        Variables:
          SESSIONS_TABLE: !Sub fichass-sessions-${GitHubRepo}
          MANIFEST_URL: !Sub http://${SiteBucketName}.s3-website-eu-west-1.amazonaws.com/characters-manifest.json
          SITE_URL: !Sub http://${SiteBucketName}.s3-website-eu-west-1.amazonaws.com

  SessionFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt SessionFunction.Arn
      AuthType: NONE
      Cors:
        # Pinned to the site origin (hardened-open endpoint, D-55).
        # OPTIONS is NOT allowed here (spec): the Function URL answers
        # the CORS preflight itself.
        AllowOrigins:
          - !Sub http://${SiteBucketName}.s3-website-eu-west-1.amazonaws.com
        AllowMethods:
          - GET
          - PATCH
        AllowHeaders:
          - content-type
        MaxAge: 86400

  # AuthType NONE does NOT auto-grant invocation: the resource-based
  # policy must declare TWO statements (Lambda docs, October 2025
  # change): InvokeFunctionUrl (below) AND InvokeFunction scoped with
  # InvokedViaFunctionUrl=true, which keeps the direct Invoke API
  # closed — the function is ONLY reachable through its URL.
  SessionFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SessionFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  SessionFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SessionFunction.Arn
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

Outputs:
  SessionUrl:
    Description: Lambda Function URL of the session persistence API (Fase 15).
    Value: !GetAtt SessionFunctionUrl.FunctionUrl
