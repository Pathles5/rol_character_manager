# ============================================================================
# FichaSS — session COMPUTE stack (Fase 15, D-54/D-55) — GESTIONADO POR CI
# ============================================================================
#
# Stack DESECHABLE de cómputo: Lambda + Function URL. La TABLA DE SESIÓN
# NO vive aquí — está en el stack de DATOS (infra/data.yaml, stack
# fichass-data, decisión del usuario 2026-11-23) para que sobreviva a la
# recreación de este stack (el self-heal de borrado/recreación dejaba la
# tabla huérfana por Retain y bloqueaba la recreación con el nombre
# ocupado — saga de huérfanos Fase 09/15). El nombre de la tabla es
# determinista y se deriva del parámetro Environment (D-69): legacy
# `fichass-sessions-<repo>`, con Environment `fichass-sessions-<env>`; el
# rol construye su ARN con !Sub — SIN cross-stack references.
#
# Gestionado por CI: job `infra` de master (patrón inline, intacto) y job
# `infra-dev` de la ruta dev (mismo patrón inline replicado, Fase 19): crea/
# actualiza/sanagua el stack en cada push. El hosting (bucket + SSM) vive en
# su propio stack (infra/template.yaml, D-70).
#
# PARÁMETRO Environment (D-69): default '' = LEGACY → nombres byte-idénticos
# a los de master hoy (Lambda/rol `fichass-session-<repo>`, tabla
# `fichass-sessions-<repo>`, CORS/env-vars sobre `fichass-site`). Con
# `Environment=dev` → Lambda `fichass-session-<env>`, rol
# `fichass-session-role-<env>`, tabla `fichass-sessions-<env>`, CORS y
# env-vars sobre `fichass-site-<env>` (orígenes website http + REST https).
#
# COSTE €0 (I2/D-11): Lambda 1M req/mes always-free, Function URL gratis,
# CloudWatch Logs free tier. SIN API Gateway (su free tier es de 12 meses →
# riesgo I2). Sin CloudFront.
#
# La Lambda valida el estado de sesión con la MISMA lógica pura que el
# cliente (src/session-schema.ts, bundle esbuild de backend/session.ts).
# ============================================================================

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FichaSS - session compute (Lambda Function URL, Free Tier only, CORS pinned to the site origin). The session TABLE lives in the DATA stack (infra/data.yaml). Parameterized by Environment (D-69).

Parameters:
  GitHubRepo:
    Type: String
    Default: rol_character_manager
    Description: GitHub repository name (legacy resource-name suffix; ignored when Environment is set).
  Environment:
    Type: String
    Default: ''
    Description: >-
      Environment suffix. '' (default) = LEGACY: fichass-session-<repo> /
      fichass-sessions-<repo> / site fichass-site (production names,
      unchanged). 'dev' (and future pre/pro) = fichass-session-<env> /
      fichass-session-role-<env> / fichass-sessions-<env> / site
      fichass-site-<env>, WITHOUT the repo suffix (D-69).
    AllowedPattern: '^$|^[a-z][a-z0-9]{0,14}$'
    ConstraintDescription: Empty string (legacy) or a short lowercase-alnum environment name such as dev.

Conditions:
  IsLegacy: !Equals [!Ref Environment, '']

Resources:

  # --------------------------------------------------------------------------
  # Session table ARN is CONSTRUCTED (no GetAtt): the table lives in the
  # DATA stack (fichass-data / fichass-data-<env>) with the deterministic
  # name below — legacy fichass-sessions-<repo>, dev fichass-sessions-<env>.
  # --------------------------------------------------------------------------
  SessionFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - IsLegacy
        - !Sub fichass-session-${GitHubRepo}
        - !Sub fichass-session-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: fichass-session-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadWriteSessionsTableOnly
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !If
                  - IsLegacy
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/fichass-sessions-${GitHubRepo}
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/fichass-sessions-${Environment}
              # Basic execution logging (CloudWatch Logs free tier).
              - Sid: LambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:*:*:*

  SessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !If
        - IsLegacy
        - !Sub fichass-session-${GitHubRepo}
        - !Sub fichass-session-${Environment}
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Handler: index.handler
      # Pre-bundled by `npm run build:backend` (esbuild single-file ESM,
      # SDK EXTERNAL) + the SDK as real node_modules — the AWS-endorsed
      # packaging: the SDK's lazy exports break under esbuild interop
      # (both ESM-require and CJS variants, diagnosed in Fase 15a).
      # NO SAM esbuild metadata: deterministic, built by the workflow.
      CodeUri: backend/dist
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt SessionFunctionRole.Arn
      Environment:
        Variables:
          # Derived from the environment (D-69): legacy = fichass-sessions-<repo>
          # + site fichass-site; dev = fichass-sessions-<env> + site fichass-site-<env>.
          SESSIONS_TABLE: !If
            - IsLegacy
            - !Sub fichass-sessions-${GitHubRepo}
            - !Sub fichass-sessions-${Environment}
          MANIFEST_URL: !If
            - IsLegacy
            - !Sub http://fichass-site.s3-website-${AWS::Region}.amazonaws.com/characters-manifest.json
            - !Sub http://fichass-site-${Environment}.s3-website-${AWS::Region}.amazonaws.com/characters-manifest.json
          SITE_URL: !If
            - IsLegacy
            - !Sub http://fichass-site.s3-website-${AWS::Region}.amazonaws.com
            - !Sub http://fichass-site-${Environment}.s3-website-${AWS::Region}.amazonaws.com

  SessionFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt SessionFunction.Arn
      AuthType: NONE
      Cors:
        # Pinned to BOTH site origins of the ENVIRONMENT bucket (hardened-open
        # endpoint, D-55): the website endpoint (http, dash) and the REST
        # endpoint (https, dot) — a player may reach the site through either.
        # Legacy = fichass-site, dev = fichass-site-<env> (D-69).
        # OPTIONS is NOT allowed here (spec): the Function URL answers
        # the CORS preflight itself.
        AllowOrigins:
          - !If
            - IsLegacy
            - !Sub http://fichass-site.s3-website-${AWS::Region}.amazonaws.com
            - !Sub http://fichass-site-${Environment}.s3-website-${AWS::Region}.amazonaws.com
          - !If
            - IsLegacy
            - !Sub https://fichass-site.s3.${AWS::Region}.amazonaws.com
            - !Sub https://fichass-site-${Environment}.s3.${AWS::Region}.amazonaws.com
        AllowMethods:
          - GET
          - PATCH
        AllowHeaders:
          - content-type
        MaxAge: 86400

  # AuthType NONE does NOT auto-grant invocation: the resource-based
  # policy must declare TWO statements (Lambda docs, October 2025
  # change): InvokeFunctionUrl (below) AND InvokeFunction scoped with
  # InvokedViaFunctionUrl=true, which keeps the direct Invoke API
  # closed — the function is ONLY reachable through its URL.
  SessionFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SessionFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  SessionFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SessionFunction.Arn
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

Outputs:
  SessionUrl:
    Description: Lambda Function URL of the session persistence API (Fase 15).
    Value: !GetAtt SessionFunctionUrl.FunctionUrl
