# ============================================================================
# FichaSS — DATA stack (Fase 15a, decisión del usuario 2026-11-23) — CI
# ============================================================================
#
# Stack SEPARADO para lo stateful (la tabla de sesión): se crea UNA vez y
# casi nunca se toca → sobrevive a cualquier recreación del stack de
# cómputo (fichass-session, infra/session.yaml), cuyo self-heal de borrado/
# recreación dejaba huérfana la tabla por Retain y bloqueaba la recreación
# con el nombre ocupado (la saga de huérfanos de Fase 09/15).
#
# SIN cross-stack references: el nombre de la tabla es determinista y se
# deriva del parámetro Environment (D-69) y el stack de cómputo construye el
# ARN con !Sub.
#
# Gestionado por CI: job `infra` de master (patrón inline, intacto) y job
# `infra-dev` de la ruta dev (mismo patrón inline replicado, Fase 19).
# COSTE €0 (I2/D-11): DynamoDB on-demand dentro de Free Tier (I1 enmendada).
# ============================================================================

AWSTemplateFormatVersion: '2010-09-09'
Description: FichaSS - session data (DynamoDB table, Retain) — own stack so it survives compute-stack recreation. Parameterized by Environment (D-69).

Parameters:
  GitHubRepo:
    Type: String
    Default: rol_character_manager
    Description: GitHub repository name (legacy resource-name suffix; ignored when Environment is set).
  Environment:
    Type: String
    Default: ''
    Description: >-
      Environment suffix. '' (default) = LEGACY: table fichass-sessions-<repo>
      (production name, unchanged). 'dev' (and future pre/pro) = table
      fichass-sessions-<env>, WITHOUT the repo suffix (D-69).
    AllowedPattern: '^$|^[a-z][a-z0-9]{0,14}$'
    ConstraintDescription: Empty string (legacy) or a short lowercase-alnum environment name such as dev.

Conditions:
  IsLegacy: !Equals [!Ref Environment, '']

Resources:

  # PK characterId; state + optimistic version + updatedAt
  # (Amendment 4 del modelo, D-55). SIN Tags (evitar dynamodb:TagResource).
  SessionsTable:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TableName: !If
        - IsLegacy
        - !Sub fichass-sessions-${GitHubRepo}
        - !Sub fichass-sessions-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: characterId
          AttributeType: S
      KeySchema:
        - AttributeName: characterId
          KeyType: HASH

Outputs:
  SessionsTableName:
    Description: Session table name (verification/tooling).
    Value: !Ref SessionsTable
  SessionsTableArn:
    Description: Session table ARN (verification/tooling).
    Value: !GetAtt SessionsTable.Arn
