# ============================================================================
# FichaSS — infra SAM template (Fase 09, D-34: SAM a petición del usuario)
# ============================================================================
#
# SIMPLIFICACIÓN FINAL (2026-11-20, tras el diagnóstico de Fase 09):
# 1. El OIDC provider de GitHub DEBE existir en la cuenta (el usuario ya lo
#    tiene por su otro proyecto). Si no existiera, crearlo UNA vez:
#      aws iam create-open-id-connect-provider \
#        --url https://token.actions.githubusercontent.com \
#        --client-id-list sts.amazonaws.com \
#        --thumbprint-list 6938fd4d98bab03faadb97b34396831e3780aea1
# 2. UN solo rol incondicional, SIN ManagedPolicy (inline policies) y SIN
#    recursos condicionales: la validación temprana de CloudFormation
#    (AWS::EarlyValidation::ResourceExistenceCheck) rechaza Refs a recursos
#    con Condition=false aunque el recurso no se cree, y resultó flaky en
#    las variantes condicionales. Sin condiciones = determinista.
# 3. El trust acepta DOS subs (StringEquals con lista = OR): la rama
#    protegida (jobs sin environment) y el environment "dev" del job deploy.
#
# DECISIÓN D-39: el workflow NO despliega stacks (sync-only). Este stack se
# crea/actualiza UNA VEZ con las credenciales del usuario. El rol tiene SOLO
# permisos S3 + lectura SSM (D-40).
#
# COSTE €0 (I2/D-11): S3 Free Tier, IAM gratis, CFN gratis, sin CloudFront.
# Tags: project: FichaSS · cost-policy: free-tier-only (S3/SSM; IAM no soporta).
# ============================================================================

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FichaSS - static S3 hosting (Free Tier) + OIDC role for GitHub Actions (sync deploy, no long-lived keys).

Parameters:
  BucketName:
    Type: String
    Default: fichass-site
    Description: Hosting bucket name (globally unique; if taken, pick another).
    AllowedPattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
  GitHubOrg:
    Type: String
    Description: GitHub repository owner (org or user).
  GitHubRepo:
    Type: String
    Description: GitHub repository name.
  GitHubBranch:
    Type: String
    Default: master
    Description: Branch allowed to deploy (only this branch triggers the sync).
  ExistingOidcProviderArn:
    Type: String
    Description: ARN of the GitHub OIDC provider that must ALREADY exist (arn:aws:iam::<account>:oidc-provider/token.actions.githubusercontent.com).

Resources:

  # --------------------------------------------------------------------------
  # Static hosting bucket (website endpoint S3; NO CloudFront per I2)
  # --------------------------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      Tags:
        - Key: project
          Value: FichaSS
        - Key: cost-policy
          Value: free-tier-only

  # Public READ-ONLY policy (only s3:GetObject; ACLs deprecated — the correct
  # way is a BucketPolicy).
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadForWebsiteHosting
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucket}/*

  # --------------------------------------------------------------------------
  # Deployment settings in SSM (D-40): the workflow reads the bucket name
  # from here — the only secret left is AWS_OIDC_ROLE_ARN.
  # NOTE: SSM Parameter Tags must be a KEY-VALUE MAP (not a list like S3
  # Bucket Tags) — the list form trips early validation with an opaque
  # "AWS::EarlyValidation::PropertyValidation" error (cfn-lint E3012).
  # --------------------------------------------------------------------------
  SsmBucketName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /fichass/bucket-name
      Type: String
      Value: !Ref SiteBucket
      Tags:
        project: FichaSS
        cost-policy: free-tier-only

  # --------------------------------------------------------------------------
  # Role assumed by GitHub Actions via web identity (no long-lived keys).
  # Trust pinned to: aud=sts.amazonaws.com and TWO allowed subs (branch ref
  # for jobs without an environment; environment sub because the deploy job
  # declares environment: dev — the OIDC token sub changes accordingly).
  # --------------------------------------------------------------------------
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fichass-github-actions-${GitHubRepo}
      MaxSessionDuration: 3600
      Tags:
        - Key: project
          Value: FichaSS
        - Key: cost-policy
          Value: free-tier-only
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # GitHub cambió el formato del sub en 2025: ahora incluye los
                # IDs numéricos (@<org-id>/<repo-id>). StringLike con comodines
                # cubre ambos formatos (viejo con nombres + nuevo con IDs):
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}
                  - !Sub repo:${GitHubOrg}@*/${GitHubRepo}@*:ref:refs/heads/${GitHubBranch}
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:environment:dev
                  - !Sub repo:${GitHubOrg}@*/${GitHubRepo}@*:environment:dev
          - Effect: Allow
            Principal:
              Federated: !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:environment:dev
                  - !Sub repo:${GitHubOrg}@*/${GitHubRepo}@*:environment:dev
      # Inline policies (NOT ManagedPolicy: early validation rejects it in
      # this template — see header). Least privilege for `aws s3 sync
      # --delete` (D-39: the workflow NEVER deploys stacks → no
      # cloudformation:*, no sam:*, no IAM:PassRole) + SSM read (D-40).
      Policies:
        - PolicyName: fichass-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListBucketForSync
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucket}
              - Sid: ReadWriteObjectsForSync
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucket}/*
              - Sid: ReadDeploymentSettingsFromSsm
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fichass/*

Outputs:
  WebsiteURL:
    Description: Public URL of the static hosting (S3 website endpoint).
    Value: !GetAtt SiteBucket.WebsiteURL
  BucketName:
    Description: Hosting bucket name (for the AWS_S3_BUCKET secret).
    Value: !Ref SiteBucket
  OidcRoleArn:
    Description: Role ARN (for the AWS_OIDC_ROLE_ARN secret).
    Value: !GetAtt GitHubActionsRole.Arn
