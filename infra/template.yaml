# ============================================================================
# FichaSS — HOSTING stack (bucket website + policy pública + SSM) — Fase 19
# ============================================================================
#
# HISTORIA: en Fase 09 este template era solo el IaC-de-referencia del
# hosting (bucket, policy y SSM VIVOS PERO HUÉRFANOS — ningún stack los
# gestionaba). DESDE FASE 19 (D-70) es el stack de hosting DESPLEGABLE POR
# CI: la ruta `dev` del workflow despliega `fichass-hosting-dev` desde aquí;
# la ruta `master` NO lo despliega (los recursos legacy siguen intactos).
#
# PARÁMETRO Environment (D-69): default '' = LEGACY → reproduce EXACTAMENTE
# los nombres actuales de producción (bucket `fichass-site`, SSM
# `/fichass/bucket-name`), byte-idénticos a los huérfanos vivos. Con
# `Environment=dev` (y futuros pre/pro) → bucket `fichass-site-<env>` y SSM
# `/fichass/<env>/bucket-name`, SIN sufijo de repo.
#
# SIN ROL OIDC AQUÍ (D-70a): este stack es SOLO bucket+policy+SSM. El rol
# OIDC de producción (`fichass-github-actions-rol_character_manager`) ya
# existe en la cuenta y su IaC de referencia es `infra/trust.json` +
# `infra/role-policy.json` — este stack NO lo crea ni lo modifica. El rol
# dedicado de dev (`fichass-github-actions-dev`) lo crea el bootstrap
# idempotente `scripts/bootstrap-dev-role.sh`.
#
# SIN Transform (AWS::Serverless): no hay recursos SAM en este template →
# create-stack/changeset SIN capabilities, el patrón ya probado en esta
# cuenta con `infra/data.yaml`. (El hosting solo usa recursos CFN puros.)
#
# QUIRKS DE LA CUENTA (spec 09/15, respetados en el workflow): primera
# creación con `aws cloudformation create-stack` DIRECTO (changesets CREATE
# flaky), self-heal de shells rotos, changesets PENDIENTES borrados nunca
# ejecutados, esperas por sondeo manual (CLI v2 sin --waiter-attempts).
#
# COSTE €0 (I2/D-11): S3 Free Tier, SSM gratis, CloudFormation gratis.
# SIN CloudFront, sin API Gateway, sin dominios. Tags en todos los recursos:
#   project: FichaSS · cost-policy: free-tier-only.
# ============================================================================

AWSTemplateFormatVersion: '2010-09-09'
Description: FichaSS - static S3 hosting (Free Tier) + SSM deployment settings, parameterized by Environment (D-69). Default '' reproduces the production names exactly (D-71).

Parameters:
  Environment:
    Type: String
    Default: ''
    Description: >-
      Environment suffix. '' (default) = LEGACY: bucket fichass-site and SSM
      /fichass/bucket-name (production names, unchanged). 'dev' (and future
      pre/pro) = suffix -<env> without the repo suffix: fichass-site-dev and
      /fichass/<env>/bucket-name.
    AllowedPattern: '^$|^[a-z][a-z0-9]{0,14}$'
    ConstraintDescription: Empty string (legacy) or a short lowercase-alnum environment name such as dev.

Conditions:
  IsLegacy: !Equals [!Ref Environment, '']

Resources:

  # --------------------------------------------------------------------------
  # Static hosting bucket (website endpoint S3; NO CloudFront per I2).
  # Name derived from Environment (D-69): legacy fichass-site / dev fichass-site-<env>.
  # --------------------------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      BucketName: !If
        - IsLegacy
        - fichass-site
        - !Sub fichass-site-${Environment}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      Tags:
        - Key: project
          Value: FichaSS
        - Key: cost-policy
          Value: free-tier-only

  # Public READ-ONLY policy (only s3:GetObject; ACLs deprecated — the correct
  # way is a BucketPolicy).
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadForWebsiteHosting
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucket}/*

  # --------------------------------------------------------------------------
  # Deployment settings in SSM (D-40): the workflow reads the bucket name
  # from here — the only secret left is AWS_OIDC_ROLE_ARN (master) / the
  # deterministic dev role ARN (dev, D-70a).
  # Name derived from Environment (D-69): legacy /fichass/bucket-name,
  # dev /fichass/<env>/bucket-name.
  # NOTE: SSM Parameter Tags must be a KEY-VALUE MAP (not a list like S3
  # Bucket Tags) — the list form trips early validation with an opaque
  # "AWS::EarlyValidation::PropertyValidation" error (cfn-lint E3012).
  # --------------------------------------------------------------------------
  SsmBucketName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !If
        - IsLegacy
        - /fichass/bucket-name
        - !Sub /fichass/${Environment}/bucket-name
      Type: String
      Value: !Ref SiteBucket
      Tags:
        project: FichaSS
        cost-policy: free-tier-only

Outputs:
  WebsiteURL:
    Description: Public URL of the static hosting (S3 website endpoint).
    Value: !GetAtt SiteBucket.WebsiteURL
  BucketName:
    Description: Hosting bucket name (for the AWS_S3_BUCKET secret / SSM).
    Value: !Ref SiteBucket
