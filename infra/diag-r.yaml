# ============================================================================
# FichaSS — infra SAM template (Fase 09, D-34: SAM a petición del usuario)
# ============================================================================
#
# SAM vs CloudFormation:
#   SAM es una extensión de CloudFormation (`Transform: AWS::Serverless-2016-10-31`).
#   Este template NO usa recursos Serverless (no hay Lambda/API — v1 es 100%
#   estático, constitución I2); usa tipos nativos AWS::S3::Bucket / AWS::IAM::*.
#   Mantenemos el transform SAM para seguir la convención que el usuario usa en
#   su otro proyecto y para poder validar/desplegar con `sam validate/build/deploy`.
#   `sam build` para este template es un no-op que copia template.yaml a
#   .aws-sam/build — no genera artefactos pagables.
#
# DECISIÓN (validada con el usuario, 2026-11-19) — supera a la spec original:
#   El workflow de GitHub Actions NO ejecuta `sam build`/`sam deploy`.
#   El despliegue del stack es ONE-TIME y lo hace el USUARIO localmente con sus
#   propias credenciales (`sam deploy --guided`, ver infra/README.md).
#   El workflow solo sincroniza `dist/` a S3 tras el quality gate.
#   Por eso el rol OIDC tiene SOLO permisos S3 (sin cloudformation:*, sin sam:*,
#   sin IAM:PassRole): mínimo privilegio. No rompe C1–C5: el deploy one-time
#   queda documentado en infra/README.md y el workflow en verde cubre C2/C3.
#
# COSTE €0 (constitución I2 / D-11 — HARD):
#   - S3 hosting estático: dentro del Free Tier (5 GB almacenamiento + los
#     primeros 2.000 requests GET/mes con capacidad de "siempre gratis" vía
#    STATIC_WEBSITE... nota: el hosting de sitios web de S3 se factura por
#     requests y salida de datos; para tráfico de un jugador es ≈0 €/mes y cae
#     dentro de los 12 meses de Free Tier / cuota siempre-gratis de datos out
#     100 GB/mes desde dic-2024).
#   - IAM OpenIDConnectProvider / Role: GRATIS (IAM no factura).
#   - CloudFormation: no factura por plantillas ni stacks.
#   - SIN CloudFront, SIN dominios gestionados, SIN recursos pagados.
#   - El usuario debe crear la ALERTA DE FACTURACIÓN EN $0 (paso 4 de
#     infra/README.md) antes del primer despliegue.
#
# Tags obligatorios (D-11/I2): todos los recursos llevan
#   project: FichaSS  y  cost-policy: free-tier-only.
#   Nota: los recursos IAM (OIDC provider, rol) NO soportan tags del mismo modo
#   en CloudFormation; el rol sí lo lleva vía Tags en AWS::IAM::Role. El OIDC
#   provider global es un recurso compartido de cuenta, sin tags aplicables.
#
# Deploy one-time (el USUARIO, con sus credenciales):
#   sam validate && sam build && sam deploy --guided
#   Si el OIDC provider ya existe en la cuenta (error AlreadyExists o
#   EntityAlreadyExists): re-desplegar con UseExistingOidcProvider=true y
#   ExistingOidcProviderArn=<arn del provider existente>.
# ============================================================================

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FichaSS — hosting estático S3 (Free Tier) + rol OIDC para GitHub Actions (deploy por aws s3 sync, sin claves longevas).

Parameters:
  BucketName:
    Type: String
    Default: fichass-site
    Description: Nombre del bucket de hosting (debe ser único globalmente; si está ocupado, el despliegue falla — elegir otro, p. ej. fichass-site-<usuario>).
    AllowedPattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
  GitHubOrg:
    Type: String
    Description: Propietario del repositorio de GitHub (org o usuario).
  GitHubRepo:
    Type: String
    Description: Nombre del repositorio de GitHub.
  GitHubBranch:
    Type: String
    Default: master
    Description: Rama que puede desplegar (solo esta rama dispara el sync).
  UseExistingOidcProvider:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Poner 'true' SOLO si la cuenta ya tiene el provider de token.actions.githubusercontent.com (evita el fallo AlreadyExists).
  ExistingOidcProviderArn:
    Type: String
    Default: ''
    Description: ARN del provider OIDC existente (requerido si UseExistingOidcProvider=true). Ejemplo arn:aws:iam::123456789012:oidc-provider/token.actions.githubusercontent.com

Conditions:
  # Crea el provider SOLO si el usuario dice que no existe ya. IAM es global:
  # un provider por cuenta/issuer; un segundo despliegue fallaría con
  # EntityAlreadyExists. Con Conditions cubrimos ambos casos sin tocar nada más.
  CreateOidcProvider: !Equals [!Ref UseExistingOidcProvider, 'false']
  # Condición complementaria (rol alternativo cuando el provider ya existe).
  UseExistingOidcProvider: !Not [!Condition CreateOidcProvider]

Resources:

  # --------------------------------------------------------------------------
  # Bucket de hosting estático (website endpoint S3; SIN CloudFront por I2)
  # --------------------------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Retain          # nunca destruir contenido por un update
    DeletionPolicy: Retain               # nunca borrar el bucket con el stack
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        # Para website hosting público necesitamos que NO se bloquee la
        # política pública ni el acceso público a objetos:
        #   - blockPublicAcls / ignorePublicAcls: no usamos ACLs (los objetos
        #     no llevan ACL pública), se bloquean.
        #   - blockPublicPolicy=false + restrictPublicBuckets=false: permite
        #     la BucketPolicy s3:GetObject pública (única vía de lectura; es la
        #     configuración estándar de hosting estático).
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        # App SPA con hash-routing y rutas relativas (base './'): toda
        # navegación es index.html#... → NO hacen falta reglas de redirección.
        # El error document también apunta a index.html (404s de ruta directa).
        IndexDocument: index.html
        ErrorDocument: index.html
      Tags:
        - Key: project
          Value: FichaSS
        - Key: cost-policy
          Value: free-tier-only

  # Política pública de LECTURA (solo s3:GetObject). No usamos AccessControl:
  # PublicRead (ACLs deprecated en buckets nuevos; la vía correcta es BucketPolicy).
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadForWebsiteHosting
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucket}/*
          - Sid: ReadDeploymentSettingsFromSsm
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fichass/*

  # --------------------------------------------------------------------------
  # Deployment settings en SSM (D-40): el workflow lee el nombre del bucket
  # de aquí — el único secret restante es AWS_OIDC_ROLE_ARN (necesario para
  # autenticarse; el resto viaja por IaC, fuente única de verdad).
  # --------------------------------------------------------------------------
  SsmBucketName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /fichass/bucket-name
      Type: String
      Value: !Ref SiteBucket
      Tags:
        - Key: project
          Value: FichaSS
        - Key: cost-policy
          Value: free-tier-only

  # --------------------------------------------------------------------------
  # OIDC provider de GitHub Actions (IAM global, gratis).
  # Condicional: solo se crea si UseExistingOidcProvider=false.
  # --------------------------------------------------------------------------
  GitHubOidcProvider:
    Type: AWS::IAM::OpenIdConnectProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # GitHub está en la librería de CAs raíz de confianza de AWS (los
      # thumbprints ya no se usan para validar providers como GitHub), pero el
      # campo es obligatorio. Incluimos los thumbprints vigentes (2025) y los
      # históricos documentados por GitHub (changelog 2023-06-27).
      ThumbprintList:
        - 7560d6f40fa55195f740ee2b1b7c0b4836cbe103
        - dd55b4520291e276588f0dd02fafd83a7368e0fa
        - 2b18947a6a9fc7764fd8b5fb18a863b0c6dac24f
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # --------------------------------------------------------------------------
  # Rol(es) que asume GitHub Actions vía web identity (sin claves longevas).
  # Trust condicionado a: aud=sts.amazonaws.com y sub exacta del repo/rama.
  # NOTA (2026-11-20): la validación temprana de CloudFormation NO acepta
  # Fn::If dentro de Principal.Federated (AWS::EarlyValidation falla), así
  # que hay DOS roles con condiciones complementarias y la MISMA política
  # adjuntada una sola vez vía ManagedPolicy (Roles admite ambos refs: el
  # rol que no se crea nunca existe y no recibe attach).
  # --------------------------------------------------------------------------
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Condition: CreateOidcProvider
    Properties:
      RoleName: !Sub fichass-github-actions-${GitHubRepo}
      MaxSessionDuration: 3600
      Tags:
        - Key: project
          Value: FichaSS
        - Key: cost-policy
          Value: free-tier-only
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              # Provider creado por este stack (IAM es global: accountId
              # basta; el sub/aud ya restringe el acceso al repo/rama).
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # sub EXACTA de la rama autorizada. Cualquier PR/otra rama/otro
                # repo con el provider compartido queda DENEGADO aquí.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}

  GitHubActionsRoleExisting:
  GitHubActionsDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: CreateOidcProvider
    Properties:
      Description: FichaSS deploy policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ListBucketForSync
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucket}
          - Sid: ReadWriteObjectsForSync
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucket}/*
          - Sid: ReadDeploymentSettingsFromSsm
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fichass/*
      Roles:
        - !Ref GitHubActionsRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Test
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucket}/*
    Type: AWS::IAM::Role
    Condition: UseExistingOidcProvider
    Properties:
      RoleName: !Sub fichass-github-actions-${GitHubRepo}
      MaxSessionDuration: 3600
      Tags:
        - Key: project
          Value: FichaSS
        - Key: cost-policy
          Value: free-tier-only
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              # Provider preexistente indicado por parámetro.
              Federated: !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}

  # Políticas compartidas: dos copias condicionales (una por rol) porque
  # CFN no admite Ref a un recurso cuya Condition es false. El documento
  # es idéntico en ambas (mínimo privilegio D-39/D-40).
  GitHubActionsDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: CreateOidcProvider
    Properties:
      Description: FichaSS deploy policy (sync-only, mínimo privilegio)
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ListBucketForSync
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucket}
          - Sid: ReadWriteObjectsForSync
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucket}/*
          - Sid: ReadDeploymentSettingsFromSsm
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fichass/*
      Roles:
        - !Ref GitHubActionsRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ListBucketForSync
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucket}
          - Sid: ReadWriteObjectsForSync
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucket}/*
          - Sid: ReadDeploymentSettingsFromSsm
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fichass/*
          - Sid: ReadWriteObjectsForSync
            Effect: Allow
            Action:
              - s3:GetObject     # lectura (sync compara; y permite verificar)
              - s3:PutObject
              - s3:DeleteObject  # DeleteObjects del --delete de sync
            Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucket}/*
          - Sid: ReadDeploymentSettingsFromSsm
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fichass/*
          - Sid: ReadDeploymentSettingsFromSsm
            Effect: Allow
            Action: ssm:GetParameter
            # Solo el namespace de este proyecto (D-40).
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fichass/*


Outputs:
  WebsiteURL:
    Description: URL pública del hosting estático (endpoint website de S3; GetAtt calcula el formato correcto por región, incl. us-east-1).
    Value: !GetAtt SiteBucket.WebsiteURL
  BucketName:
    Description: Nombre del bucket de hosting (para el secret AWS_S3_BUCKET).
    Value: !Ref SiteBucket
  OidcRoleArn:
    Description: ARN del rol para el secret AWS_OIDC_ROLE_ARN (uno de los dos roles condicionales).
    Value: !If [CreateOidcProvider, !GetAtt GitHubActionsRole.Arn, !GetAtt GitHubActionsRoleExisting.Arn]