<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FichaSS · capturas de mockup (390×844)</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:24px; background:#0b0d12; color:#e8ebf2; font:14px "Segoe UI", system-ui, sans-serif; }
  h1 { font-size:16px; font-weight:600; margin:0 0 6px; }
  p.hint { color:#9aa3b2; margin:0 0 20px; font-size:12.5px; }
  section { margin-bottom:32px; }
  .vhead { font-weight:600; letter-spacing:.06em; margin:0 0 10px; color:#8fb3e8; text-transform:uppercase; font-size:12px; }
  .row { display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
  figure { margin:0; }
  figcaption { font-size:11px; color:#9aa3b2; margin-bottom:6px; letter-spacing:.04em; }
  .shot { width:390px; height:844px; border:1px solid rgba(168,178,203,.25); border-radius:14px; background:#0b0d12; }
  /* Scroll interno dentro del iframe, pinchazo sin interacción */
</style>

<body>
  <h1>FichaSS · Fase 00 — capturas de mockup</h1>

  <section>
    <h2 class="vhead">Variante A — Porcelana oscura</h2>
    <div class="row">
      <figure><figcaption>aventura</figcaption><iframe class="shot" src="variant-a/aventura.html" title="A aventura"></iframe></figure>

    </div>
  </section>

  <section>

      <figure><figcaption>combate</figcaption><iframe class="shot" src="variant-b/combate.html" title="B combate"></iframe></figure>
      <figure><figcaption>descanso</figcaption><iframe class="shot" src="variant-b/descanso.html" title="B descanso"></iframe></figure>
      <figure><figcaption>drawer</figcaption><iframe class="shot" src="variant-b/drawer.html" title="B drawer"></iframe></figure>
      <figure><figcaption>bottom sheet</figcaption><iframe class="shot" src="variant-b/sheet.html" title="B sheet"></iframe></figure>
    </div>
  </section>
