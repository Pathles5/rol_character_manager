AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FichaSS - session persistence (DynamoDB + Lambda Function URL, Free Tier
  only, CORS pinned to the site origin).
Parameters:
  GitHubRepo:
    Type: String
    Default: rol_character_manager
    Description: GitHub repository name (resource-name suffix).
  SiteBucketName:
    Type: String
    Default: fichass-site
    Description: Hosting bucket name (read-only source of the authored JSONs).
Resources:
  SessionsTable:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TableName:
        Fn::Sub: fichass-sessions-${GitHubRepo}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: characterId
        AttributeType: S
      KeySchema:
      - AttributeName: characterId
        KeyType: HASH
    Metadata:
      SamResourceId: SessionsTable
  SessionFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: fichass-session-${GitHubRepo}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: fichass-session-runtime
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: ReadWriteOwnTableOnly
            Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            Resource:
              Fn::GetAtt:
              - SessionsTable
              - Arn
          - Sid: LambdaLogs
            Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:*:*:*
    Metadata:
      SamResourceId: SessionFunctionRole
  SessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: fichass-session-${GitHubRepo}
      Runtime: nodejs22.x
      Architectures:
      - arm64
      Handler: index.handler
      CodeUri: s3://fichass-site/sam-artifacts-local/35b001883381cb3483fdb79a1c031c35
      MemorySize: 256
      Timeout: 10
      Role:
        Fn::GetAtt:
        - SessionFunctionRole
        - Arn
      Environment:
        Variables:
          SESSIONS_TABLE:
            Ref: SessionsTable
          MANIFEST_URL:
            Fn::Sub: http://${SiteBucketName}.s3-website-eu-west-1.amazonaws.com/characters-manifest.json
          SITE_URL:
            Fn::Sub: http://${SiteBucketName}.s3-website-eu-west-1.amazonaws.com
    Metadata:
      SamResourceId: SessionFunction
  SessionFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn:
        Fn::GetAtt:
        - SessionFunction
        - Arn
      AuthType: NONE
      Cors:
        AllowOrigins:
        - Fn::Sub: http://${SiteBucketName}.s3-website-eu-west-1.amazonaws.com
        AllowMethods:
        - GET
        - PATCH
        AllowHeaders:
        - content-type
        MaxAge: 86400
    Metadata:
      SamResourceId: SessionFunctionUrl
Outputs:
  SessionUrl:
    Description: Lambda Function URL of the session persistence API (Fase 15).
    Value:
      Fn::GetAtt:
      - SessionFunctionUrl
      - FunctionUrl
  SessionsTableName:
    Description: Session table name (verification/tooling).
    Value:
      Ref: SessionsTable
