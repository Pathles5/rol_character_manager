# ============================================================================
# FichaSS — CI/CD (Fase 09, D-12). Quality gate + infra + sync S3 vía OIDC.
# ============================================================================
#
# DECISIÓN (Fase 09, D-39/D-40 — SUPERADA PARCIALMENTE por D-54/D-55, Fase 15):
#   Fase 09: el workflow NO tocaba infra (sync-only, despliegues locales
#   one-time). Fase 15 (criterio del usuario, 2026-11-22): TODA la infra se
#   gestiona desde la pipeline — el job `infra` hace `sam build` +
#   `sam deploy` del stack (changeset-update; el quirk changeset-CREATE roto
#   de la cuenta quedó remediado por el bootstrap one-time de Fase 09) y en
#   local NO se despliega nunca. El rol OIDC amplió su policy con lo mínimo
#   para desplegar, acotado al prefijo fichass-* (I2: permisos, no recursos).
#   El site sigue: quality-gate (lint → test → build) → sync S3, y el job
#   deploy publica además la URL de la API de sesión (session-url.json).
#
# COSTE €0 (constitución I2 / D-11):
#   - Minutos de Actions: dentro de la cuota gratuita (repo público = gratis;
#     runners ubuntu-latest ×1 en workflow corto). Nada de runners self-hosted
#     ni matrices grandes.
#   - S3/Lambda/DynamoDB: Free Tier / always-free para un proyecto de un
#     jugador. Alerta de facturación 3€/10€ activada (spec 09).
#
# NOTA sobre `check.ps1` (compuerta documental del harness):
#   `npm run check` es un script PowerShell del harness LOCAL y el gate de fase
#   se ejecuta en el repo por el orquestador/revisor (D-08 del harness). En el
#   runner Linux no es aplicable; su función documental (constitución, spec
#   vigente, INDEX.md coherente) se garantiza en la compuerta de fase local
#   ANTES del push que dispara este workflow. NO se sustituye aquí por nada.
#   (Se podría ejecutar con pwsh en ubuntu, pero es una compuerta de proceso,
#   no de producto; deliberadamente fuera del workflow.)
#
# Estrategia de Cache-Control (ver decisión en el job deploy).
# ============================================================================
name: deploy

on:
  push:
    branches: [master]        # rama parametrizada en el stack (GitHubBranch)
  workflow_dispatch:          # arranque manual desde la pestaña Actions

# Un solo despliegue a la vez: si llegan pushes rápidos en ráfaga, se encolan
# en orden (cancel-in-progress: false) para que nunca corran dos sync
# simultáneos contra el mismo bucket.
concurrency:
  group: fichass-deploy-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- quality
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Compuertas del proyecto (I6/I7). El prebuild genera
      # characters-manifest.json antes del build (hook npm "prebuild").
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build (incluye manifest via prebuild)
        run: npm run build

      # El job deploy no re-construye: baja este artefacto (mismo dist que
      # pasó el gate). Retención 1 día: desaparece solo, 0 coste.
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------- infra
  # Fase 15 (D-54/D-55): Toda la infra se despliega desde la pipeline.
  # sam build (con --base-dir . para resolver el CodeUri `backend/dist`
  # desde la raíz del repo) + sam deploy del stack existente.
  infra:
    if: github.ref == 'refs/heads/master'
    environment: dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # imprescindible para OIDC (aws-actions + STS)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # El bundle de la Lambda es determinista y va ANTES de sam build:
      # esbuild single-file ESM con el SDK inlinado (sin SAM esbuild
      # metadata; el CodeUri apunta a backend/dist ya construido).
      - name: Bundle the session Lambda (esbuild)
        run: npm run build:backend

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials (OIDC, sin claves longevas)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Read artifact bucket from SSM (D-40)
        run: |
          BUCKET=$(aws ssm get-parameter --name /fichass/bucket-name --query Parameter.Value --output text)
          echo "AWS_S3_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Sam build
        run: >
          sam build
          --template infra/session.yaml
          --base-dir .
          --build-dir .aws-sam/build

      # Empaqueta el código de la Lambda (zip a S3, sam-artifacts/) y
      # reescribe el CodeUri del template a la ubicación S3 — sin esto,
      # un changeset con --template-body no puede resolver rutas locales.
      - name: Sam package
        run: >
          sam package
          --template .aws-sam/build/template.yaml
          --s3-bucket $AWS_S3_BUCKET
          --s3-prefix sam-artifacts
          --output-template-file .aws-sam/packaged.yaml

      # ---------------------------------------------------------------
      # FASE 15a (decisión del usuario 2026-11-23): la TABLA DE SESIÓN
      # vive en su PROPIO stack de datos (fichass-data) — se crea UNA vez
      # y sobrevive a la recreación del stack de cómputo (el self-heal de
      # fichass-session ya no la deja huérfana ni choca con su nombre).
      # Sin cross-stack references: nombre determinista + ARN !Sub.
      # ---------------------------------------------------------------
      - name: Deploy data stack (fichass-data)
        run: |
          REGION=${{ secrets.AWS_REGION }}
          STACK=fichass-data
          TEMPLATE=infra/data.yaml
          STATUS=$(aws cloudformation describe-stacks --stack-name $STACK \
            --query "Stacks[0].StackStatus" --output text --region $REGION 2>/dev/null || echo MISSING)
          echo "[$STACK] estado: $STATUS"

          case "$STATUS" in
            MISSING|ROLLBACK_COMPLETE|UPDATE_ROLLBACK_COMPLETE|CREATE_FAILED|REVIEW_IN_PROGRESS)
              if [ "$STATUS" != "MISSING" ]; then
                echo "Shell roto: self-heal"
                aws cloudformation delete-stack --stack-name $STACK --region $REGION
                GONE=""
                for i in $(seq 1 60); do
                  S=$(aws cloudformation describe-stacks --stack-name $STACK \
                    --query "Stacks[0].StackStatus" --output text --region $REGION 2>/dev/null || echo GONE)
                  echo "[$i] borrando: $S"
                  if [ "$S" = "GONE" ]; then GONE=yes; break; fi
                  sleep 10
                done
                [ -n "$GONE" ] || { echo "El shell no se borró a tiempo"; exit 1; }
              fi
              echo "Creación DIRECTA (create-stack, sin changeset)"
              aws cloudformation create-stack \
                --stack-name $STACK \
                --template-body file://$TEMPLATE \
                --region $REGION
              ;;
            CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE)
              CHGSET="samdeploy-${{ github.run_id }}-${{ github.run_attempt }}"
              aws cloudformation create-change-set \
                --stack-name $STACK \
                --change-set-name "$CHGSET" \
                --change-set-type UPDATE \
                --template-body file://$TEMPLATE \
                --region $REGION
              echo "Esperando al changeset (sondeo manual)..."
              CS=""
              for i in $(seq 1 60); do
                CS=$(aws cloudformation describe-change-set --stack-name $STACK \
                  --change-set-name "$CHGSET" --query "Status" --output text --region $REGION 2>/dev/null || echo PENDING)
                echo "[$i] changeset: $CS"
                case "$CS" in
                  CREATE_COMPLETE) break ;;
                  FAILED) echo "Changeset FAILED"; exit 1 ;;
                esac
                sleep 10
              done
              [ "$CS" = "CREATE_COMPLETE" ] || { echo "Timeout en el changeset"; exit 1; }
              aws cloudformation execute-change-set --stack-name $STACK --change-set-name "$CHGSET" --region $REGION
              ;;
            *) echo "Estado inesperado: $STATUS"; exit 1 ;;
          esac

          # Asentar el stack (sondeo manual, timeout generoso)
          for i in $(seq 1 90); do
            S=$(aws cloudformation describe-stacks --stack-name $STACK \
              --query "Stacks[0].StackStatus" --output text --region $REGION 2>/dev/null || echo MISSING)
            echo "[$i] [$STACK]: $S"
            case "$S" in
              CREATE_COMPLETE|UPDATE_COMPLETE) echo "asentado"; break ;;
              CREATE_FAILED|UPDATE_FAILED|ROLLBACK_COMPLETE|ROLLBACK_FAILED|UPDATE_ROLLBACK_COMPLETE|UPDATE_ROLLBACK_FAILED)
                echo "terminal: $S"; exit 1 ;;
            esac
            [ "$i" = "90" ] && { echo "timeout"; exit 1; }
            sleep 10
          done

      # ---------------------------------------------------------------
      # Stack de CÓMPUTO de sesión (desechable): Lambda + Function URL.
      # La tabla vive en fichass-data (paso anterior) — este stack puede
      # borrarse y recrearse sin tocarla.
      # ---------------------------------------------------------------
      - name: Deploy (create / self-heal / update)
        # Tres caminos, con la saga de esta cuenta documentada:
        #   1. Stack ausente o shell roto (REVIEW_IN_PROGRESS / ROLLBACK /
        #      CREATE_FAILED) → create-stack DIRECTO (los changesets CREATE
        #      fallan la validación temprana de forma flaky aquí); shells
        #      rotos se borran primero (self-heal).
        #   2. Stack estable → changeset UPDATE (+ ejecución del pendiente
        #      si lo hay) con espera por sondeo manual.
        #   3. AWS CLI v2 NO soporta --waiter-attempts: TODAS las esperas
        #      son bucles de sondeo con timeout generoso.
        run: |
          REGION=${{ secrets.AWS_REGION }}
          STACK=fichass-session
          STATUS=$(aws cloudformation describe-stacks --stack-name $STACK \
            --query "Stacks[0].StackStatus" --output text --region $REGION 2>/dev/null || echo MISSING)
          echo "Estado del stack: $STATUS"

          case "$STATUS" in
            MISSING|ROLLBACK_COMPLETE|UPDATE_ROLLBACK_COMPLETE|CREATE_FAILED|REVIEW_IN_PROGRESS)
              if [ "$STATUS" != "MISSING" ]; then
                echo "Shell roto ($STATUS): self-heal, se borra para recrear"
                # NOTA (D-55): sobre UPDATE_ROLLBACK_COMPLETE CFN no ejecuta
                # changesets (haría falta continue-update-rollback y otro
                # permiso) — borrar y crear directo es más simple; la tabla
                # tiene Retain y sobrevive al borrado del stack.
                aws cloudformation delete-stack --stack-name $STACK --region $REGION
                GONE=""
                for i in $(seq 1 60); do
                  S=$(aws cloudformation describe-stacks --stack-name $STACK \
                    --query "Stacks[0].StackStatus" --output text --region $REGION 2>/dev/null || echo GONE)
                  echo "[$i] borrando: $S"
                  if [ "$S" = "GONE" ]; then GONE=yes; break; fi
                  sleep 10
                done
                if [ -z "$GONE" ]; then echo "El shell no se borró a tiempo"; exit 1; fi
              fi
              echo "Creación DIRECTA (create-stack, sin changeset)"
              aws cloudformation create-stack \
                --stack-name $STACK \
                --template-body file://.aws-sam/packaged.yaml \
                --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
                --region $REGION
              ;;
            CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE)
              PENDING=$(aws cloudformation list-change-sets --stack-name $STACK \
                --query "Summaries[?ExecutionStatus=='AVAILABLE' && Status=='CREATE_COMPLETE'].ChangeSetId" \
                --output text --region $REGION | head -n 1)
              if [ -n "$PENDING" ]; then
                echo "Changeset pendiente detectado, se ejecuta: $PENDING"
                CHGSET="$PENDING"
              else
                CHGSET="samdeploy-${{ github.run_id }}-${{ github.run_attempt }}"
                aws cloudformation create-change-set \
                  --stack-name $STACK \
                  --change-set-name "$CHGSET" \
                  --change-set-type UPDATE \
                  --template-body file://.aws-sam/packaged.yaml \
                  --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
                  --region $REGION
                echo "Esperando al changeset $CHGSET (sondeo manual)..."
                CS=""
                for i in $(seq 1 60); do
                  CS=$(aws cloudformation describe-change-set --stack-name $STACK \
                    --change-set-name "$CHGSET" \
                    --query "Status" --output text --region $REGION 2>/dev/null || echo PENDING)
                  echo "[$i] changeset: $CS"
                  case "$CS" in
                    CREATE_COMPLETE) break ;;
                    FAILED) echo "Changeset FAILED"; exit 1 ;;
                  esac
                  sleep 10
                done
                if [ "$CS" != "CREATE_COMPLETE" ]; then echo "Timeout en el changeset"; exit 1; fi
              fi
              echo "Ejecutando el changeset..."
              aws cloudformation execute-change-set \
                --stack-name $STACK \
                --change-set-name "$CHGSET" \
                --region $REGION
              ;;
            *)
              echo "Estado inesperado: $STATUS"; exit 1 ;;
          esac

      - name: Wait for the stack to settle
        # AWS CLI v2 NO soporta --waiter-attempts: bucle de sondeo manual
        # con timeout generoso (la cuenta es lenta — saga Fase 09).
        run: |
          REGION=${{ secrets.AWS_REGION }}
          for i in $(seq 1 60); do
            STATUS=$(aws cloudformation describe-stacks --stack-name fichass-session \
              --query "Stacks[0].StackStatus" --output text --region $REGION 2>/dev/null || echo MISSING)
            echo "[$i] estado del stack: $STATUS"
            case "$STATUS" in
              CREATE_COMPLETE|UPDATE_COMPLETE)
                echo "Stack asentado en $STATUS"; exit 0 ;;
              CREATE_FAILED|UPDATE_FAILED|ROLLBACK_COMPLETE|ROLLBACK_FAILED|UPDATE_ROLLBACK_COMPLETE|UPDATE_ROLLBACK_FAILED)
                echo "Stack en estado terminal: $STATUS"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timeout esperando al stack"; exit 1

  # ----------------------------------------------------------------- deploy
  deploy:
    needs: [quality-gate, infra]
    # Solo despliega en la rama protegida (workflow_dispatch desde otra rama
    # compilaría pero NO tocaría el bucket).
    if: github.ref == 'refs/heads/master'
    # Los secrets (AWS_OIDC_ROLE_ARN / AWS_REGION) viven en el environment
    # "dev" (creado por el usuario 2026-11-20) — ver infra/README.md.
    environment: dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # imprescindible para OIDC (aws-actions + STS)

    steps:
      - name: Download dist (del quality-gate)
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Configure AWS credentials (OIDC, sin claves longevas)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ---------------------------------------------------------------
      # Config de despliegue desde la IaC (D-40): el stack publica el
      # nombre del bucket en SSM (/fichass/bucket-name) y el workflow
      # lo lee aquí — AWS_S3_BUCKET ya no es un secret. (AWS_REGION sí
      # sigue siendo secret: hay que conocerla ANTES de autenticarse.)
      # ---------------------------------------------------------------
      - name: Read deployment settings from SSM (IaC)
        run: |
          BUCKET=$(aws ssm get-parameter --name /fichass/bucket-name --query Parameter.Value --output text)
          echo "AWS_S3_BUCKET=$BUCKET" >> "$GITHUB_ENV"
          echo "Deploy target bucket: $BUCKET"

      # ---------------------------------------------------------------
      # Fase 15 (D-55): publica la URL de la API de sesión como
      # session-url.json en la raíz del site (cache-control revalidate,
      # igual que el index). El cliente de sync (Fase 15b) la lee al
      # arrancar; si el fichero no existe o falla la lectura, la capa
      # de sync queda deshabilitada grácilmente.
      # ---------------------------------------------------------------
      - name: Publish session API URL (Fase 15) into dist
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name fichass-session \
            --query "Stacks[0].Outputs[?OutputKey=='SessionUrl'].OutputValue" --output text)
          if [ -n "$URL" ] && [ "$URL" != "None" ]; then
            printf '{"url":"%s"}\n' "$URL" > dist/session-url.json
            echo "Session API URL published: $URL"
          else
            echo "No SessionUrl output yet — sync layer stays disabled"
          fi

      # ---------------------------------------------------------------
      # Estrategia Cache-Control:
      #   Los flags --cache-control de `s3 sync` se aplican a TODO lo que ese
      #   sync SUBE (los objetos que ya existen con mismo tamaño+ETag no se
      #   re-suben y conservan sus cabeceras). Aprovechamos eso con DOS sync:
      #     1) dist/assets/  →  s3://.../assets  con immutable:
      #        los assets de Vite llevan hash en el nombre → pueden cachearse
      #        1 año. --delete limpia hashes de builds anteriores.
      #     2) dist/ → raíz con must-revalidate: index.html,
      #        characters-manifest.json y characters/*.json SIEMPRE revalidados
      #        (max-age=0): así los edits de personajes se ven al instante. Los
      #        assets ya subidos en el paso 1 se saltan por el sync y NO pierden
      #        su cabecera immutable (documentado en el template y el README).
      #   SPA por hash-routing + rutas relativas: sin reglas de redirección.
      # ---------------------------------------------------------------
      - name: Sync immutable assets (hashed, 1 año)
        run: >
          aws s3 sync dist/assets s3://$AWS_S3_BUCKET/assets
          --cache-control "max-age=31536000,immutable"
          --delete
        # AWS_S3_BUCKET llega via GITHUB_ENV desde el paso "Read deployment
        # settings from SSM" (D-40) — NO usar secrets.AWS_S3_BUCKET (ya no
        # existe como secret y pisa el valor con vacío).

      - name: Sync site (HTML/manifest/characters, siempre revalidar)
        run: >
          aws s3 sync dist/ s3://$AWS_S3_BUCKET/
          --cache-control "max-age=0,must-revalidate"
          --delete
